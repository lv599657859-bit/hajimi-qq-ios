name: HajimiQQ
options:
  bundleIdPrefix: com.zizhe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  HajimiQQ:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zizhe.hajimiqq
        PRODUCT_NAME: HajimiQQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 哈基米QQ
        CFBundleShortVersionString: "3.3.0"
        CFBundleVersion: "9"
        UIBackgroundModes:
          - audio
          - fetch
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 用于在同一 Wi-Fi 或手机个人热点下自动发现并直连电脑端 DSH 会话。
        NSPhotoLibraryUsageDescription: 用于自定义缩放裁切你的头像、哈基米头像与立绘，以及在聊天中发送照片。
        NSPhotoLibraryAddUsageDescription: 用于将聊天中的图片或立绘保存到系统相册。
        NSCameraUsageDescription: 用于拍摄照片发送给哈基米或更换自定义头像。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInLocalNetworks: true
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false

schemes:
  HajimiQQ:
    build:
      targets:
        HajimiQQ: all
    run:
      config: Debug
